name: Perbarui titik api & terbitkan WebGIS

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'   # setiap 6 jam (UTC); FIRMS NRT diperbarui ~3 jam setelah lintasan satelit
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  terbitkan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Unduh titik api NASA FIRMS 7 hari terakhir
        if: github.event_name != 'push'
        run: python3 scripts/perbarui_titik_api.py

      - name: Simpan data terbaru ke repositori
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/titik_api_7hari.js data/arsip_harian.js
          if ! git diff --cached --quiet; then
            git commit -m "Perbarui titik api 7 hari (NASA FIRMS NRT)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
